# Runtime on the VM (/opt/reactive-ui), managed by ../deploy.sh.
# Nothing is published on the host: traffic arrives only through the
# Cloudflare Tunnel (cloudflared -> web:8080).
name: reactive-ui

services:
  web:
    # Image built on the Mac and loaded over SSH; deploy.sh sets APP_IMAGE in .env.
    image: ${APP_IMAGE:?APP_IMAGE must be set in .env}
    restart: unless-stopped
    environment:
      # Secret path segment of the planner pages (/plan/<key>); stored only in .env
      PLANNER_KEY: ${PLANNER_KEY:?PLANNER_KEY must be set in .env}
      # Naver Maps (NCP Maps > Application > Client ID); the course map is hidden when empty
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID:-}
      # 4-8 digits (a birthday) that open the list of every shared course at /; closed when empty
      ARCHIVE_PASSCODE: ${ARCHIVE_PASSCODE:-}
      # Cloudflare Turnstile for that form (infra outputs turnstile_site_key / turnstile_secret);
      # set both or neither
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # Write-only Object Storage URL for the daily database backup (infra output backup_url)
      BACKUP_URL: ${BACKUP_URL:-}
    volumes:
      - /data/reactive-ui:/data # SQLite database lives on the block volume
    stop_grace_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From `terraform output -raw tunnel_token`, stored only in /opt/reactive-ui/.env
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env}
    depends_on:
      - web
